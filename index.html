<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  /* nav/#resultBar set display:flex, which would otherwise beat the UA [hidden] rule */
  [hidden]{display:none !important}
  :root{
    --bg:#0b0d10; --surface:#14171c; --surface2:#1b1f26; --line:#252b34;
    --txt:#f2f4f7; --dim:#8b95a5; --dim2:#5f6875;
    --top:#5b9cff; --thunder:#f5a524; --faith:#a78bfa; --tech:#2dd4a7;
    --live:#ff4d4d;
    --safe-t:env(safe-area-inset-top); --safe-b:env(safe-area-inset-bottom);
  }
  html{background:var(--bg);-webkit-text-size-adjust:100%}
  body{
    background:var(--bg); color:var(--txt);
    font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    overscroll-behavior-y:none; padding-bottom:calc(28px + var(--safe-b));
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none}

  /* ---------- header ---------- */
  header{
    position:sticky; top:0; z-index:50; background:rgba(11,13,16,.82);
    backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
    border-bottom:1px solid var(--line); padding-top:var(--safe-t);
  }
  .bar{display:flex;align-items:center;gap:10px;padding:10px 16px 8px}
  .brand{font:800 21px/1 -apple-system,BlinkMacSystemFont,sans-serif;letter-spacing:-.5px}
  .brand span{color:var(--top)}
  .stamp{margin-left:auto;font-size:11.5px;color:var(--dim2);text-align:right;letter-spacing:.2px}
  .stamp b{display:block;color:var(--dim);font-weight:600;font-size:11.5px}
  .refresh{
    width:34px;height:34px;flex:0 0 34px;border-radius:50%;border:1px solid var(--line);
    background:var(--surface);color:var(--dim);display:grid;place-items:center;cursor:pointer;
  }
  .refresh:active{background:var(--surface2)}
  .refresh svg{width:16px;height:16px}
  .refresh.spin svg{animation:sp .9s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  /* ---------- tabs ---------- */
  nav{display:flex;gap:6px;padding:0 12px 9px;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  .tab{
    flex:0 0 auto;padding:7px 14px;border-radius:999px;background:var(--surface);
    border:1px solid var(--line);color:var(--dim);font-size:13.5px;font-weight:600;
    white-space:nowrap;cursor:pointer;display:flex;align-items:center;gap:6px;
  }
  .tab .dot{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}
  .tab[data-k="top"]{--c:var(--top)} .tab[data-k="thunder"]{--c:var(--thunder)}
  .tab[data-k="faith"]{--c:var(--faith)} .tab[data-k="tech"]{--c:var(--tech)}
  .tab.on{background:var(--c);border-color:var(--c);color:#0b0d10}
  .tab.on .dot{opacity:0;width:0}
  .tab .n{font-size:11px;opacity:.65;font-variant-numeric:tabular-nums}

  /* ---------- progress ---------- */
  #prog{height:2px;background:transparent;overflow:hidden}
  #prog i{display:block;height:100%;width:0;background:var(--top);transition:width .35s ease}

  /* ---------- score strip ---------- */
  .score{
    margin:12px 12px 4px;background:linear-gradient(135deg,#1d1608,#14171c);
    border:1px solid #3b2f14;border-radius:14px;padding:12px 14px;
  }
  .score .lbl{font-size:10.5px;font-weight:700;letter-spacing:1.2px;color:var(--thunder);text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:6px}
  .score .row{display:flex;align-items:center;gap:10px;padding:5px 0}
  .score .row+.row{border-top:1px solid #2a2313;margin-top:4px;padding-top:9px}
  .score .tm{font-size:14.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .score .sc{font:700 17px/1 -apple-system,sans-serif;font-variant-numeric:tabular-nums}
  .score .meta{font-size:11.5px;color:var(--dim2);margin-top:7px}
  .score .win{color:#2dd4a7} .score .loss{color:#ff6b6b}
  .pill{font-size:10px;font-weight:700;letter-spacing:.6px;padding:2px 7px;border-radius:5px;background:#2a2313;color:var(--thunder);text-transform:uppercase}
  .pill.live{background:var(--live);color:#fff;animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.55}}

  /* ---------- headlines ---------- */
  main{padding:6px 0 0}

<script>
"use strict";

/* ============================================================
   FEEDS — every one verified live. Free / non-paywalled only.
   ============================================================ */
var FEEDS = [
  // Free sources only. WSJ (HTTP 401 on every feed) and Washington Post (metered) were
  // removed; The Verge was removed after 2 of 3 sampled articles came back schema-gated.
  {c:"top", s:"BBC",          u:"https://feeds.bbci.co.uk/news/world/rss.xml",                cap:10},
  {c:"top", s:"BBC US",       u:"https://feeds.bbci.co.uk/news/world/us_and_canada/rss.xml",  cap:8},
  {c:"top", s:"PBS",          u:"https://www.pbs.org/newshour/feeds/rss/headlines",           cap:10},
  {c:"top", s:"NPR",          u:"https://feeds.npr.org/1001/rss.xml",                         cap:10},
  {c:"top", s:"NPR National", u:"https://feeds.npr.org/1003/rss.xml",                         cap:8},
  {c:"top", s:"ABC News",     u:"https://abcnews.go.com/abcnews/topstories",                  cap:10},
  {c:"top", s:"CBS News",     u:"https://www.cbsnews.com/latest/rss/main",                    cap:10},

  {c:"thunder", s:"Daily Thunder",   u:"https://dailythunder.com/feed/",                      cap:8},
  {c:"thunder", s:"ESPN NBA",        u:"https://www.espn.com/espn/rss/nba/news",     cap:8, okc:true},
  {c:"thunder", s:"Thunderous Int.", u:"https://thunderousintentions.com/feed/",              cap:4},

  {c:"faith", s:"RNS",                u:"https://religionnews.com/feed/",                     cap:8},
  {c:"faith", s:"Christianity Today", u:"https://www.christianitytoday.com/rss",              cap:7},
  {c:"faith", s:"Gospel Coalition",   u:"https://www.thegospelcoalition.org/feed/",           cap:6},
  {c:"faith", s:"Relevant",           u:"https://relevantmagazine.com/feed/",                 cap:5},

  {c:"tech", s:"CNBC",         u:"https://search.cnbc.com/rs/search/combinedcms/view.xml?partnerId=wrss01&id=100003114", cap:8},
  {c:"tech", s:"BBC Business", u:"https://feeds.bbci.co.uk/news/business/rss.xml",            cap:7},
  {c:"tech", s:"NPR Business", u:"https://feeds.npr.org/1006/rss.xml",                        cap:6},
  {c:"tech", s:"Ars Technica", u:"https://feeds.arstechnica.com/arstechnica/index",           cap:6},
  {c:"tech", s:"TechCrunch",   u:"https://techcrunch.com/feed/",                              cap:6},
  {c:"tech", s:"Engadget",     u:"https://www.engadget.com/rss.xml",                          cap:5}
];

// Which outlet wins when several cover the same story. Lower = preferred.
var SOURCE_RANK = {
  "BBC":1, "BBC US":1, "PBS":2, "NPR":3, "NPR National":3, "ABC News":4, "CBS News":5,
  "ESPN":1, "Daily Thunder":2, "Thunderous Int.":4,
  "RNS":1, "Christianity Today":2, "Gospel Coalition":3, "Relevant":4,
  "CNBC":1, "BBC Business":2, "NPR Business":3, "Ars Technica":4, "TechCrunch":5, "Engadget":6
};

// Never link out to a domain that demands a subscription.
var PAYWALL_DOMAINS = ["wsj.com","washingtonpost.com","nytimes.com","ft.com","economist.com",
  "bloomberg.com","theathletic.com","newyorker.com","barrons.com","theinformation.com",
  "seekingalpha.com","telegraph.co.uk","thetimes.co.uk"];

var STOPWORDS = {};
("a an the and or but of in on at to for with from by as is are was were be been being that this " +
 "these those it its his her their they them he she you your we our us i not no new say says said " +
 "after before over under about into out up down off then than who what when where why how which " +
 "will would can could may might must should has have had do does did more most some any all one " +
 "two amid watch live update updates video photos analysis opinion report reports").split(" ")
  .forEach(function(w){ STOPWORDS[w]=1; });

var SIM_THRESHOLD = 0.45;              // tuned on live data; below this, false merges appear
var CLUSTER_WINDOW = 48*3600*1000;

var CATS = [
  {k:"top",     label:"Top"},
  {k:"thunder", label:"Thunder"},
  {k:"faith",   label:"Faith"},
  {k:"tech",    label:"Money & Tech"}
];

// Matches Thunder coverage inside general NBA feeds.
var OKC_RE = /(\bthunder\b|\bokc\b|oklahoma city|gilgeous|\bshai\b|holmgren|jalen williams|lu dort|caruso|daigneault|hartenstein|\bpresti\b|aaron wiggins|nikola topi|isaiah joe|cason wallace|ajay mitchell|kenrich williams)/i;
var PROXIES = [
  {id:"corsproxy",  mode:"xml",  make:function(u){ return "https://corsproxy.io/?url=" + encodeURIComponent(u); }},
  {id:"allorigins", mode:"xml",  make:function(u){ return "https://api.allorigins.win/raw?url=" + encodeURIComponent(u); }},
  {id:"rss2json",   mode:"json", make:function(u){ return "https://api.rss2json.com/v1/api.json?rss_url=" + encodeURIComponent(u); }},
  {id:"aowrap",     mode:"wrap", make:function(u){ return "https://api.allorigins.win/get?url=" + encodeURIComponent(u); }}
];

var CACHE_KEY="wire.cache.v1", READ_KEY="wire.read.v1", STALE_MS=15*60*1000;

/* ============================================================
   State
   ============================================================ */
var state = { items:[], cat:"top", q:"", loading:false, booting:false, fetchedAt:0, okGames:null, ok:0, fail:0 };
var readSet = new Set();
try { readSet = new Set(JSON.parse(localStorage.getItem(READ_KEY) || "[]")); } catch(e){}

var $ = function(id){ return document.getElementById(id); };

/* ============================================================
   Utilities
   ============================================================ */
function decodeEnt(s){
  if(!s) return "";
  var t = document.createElement("textarea");
  t.innerHTML = s;
  return t.value;
}
function clean(s){
  if(!s) return "";
  s = String(s).replace(/<!\[CDATA\[|\]\]>/g,"");
  s = s.replace(/<[^>]*>/g," ");
  s = decodeEnt(s);
  return s.replace(/\s+/g," ").trim();
}
function normKey(t){
  return clean(t).toLowerCase().replace(/[^a-z0-9 ]/g,"").replace(/\s+/g," ").trim().slice(0,72);
}
function parseDate(s){
  if(!s) return 0;
  var d = Date.parse(s);
  if(!isNaN(d)) return d;
  d = Date.parse(String(s).replace(/([+-]\d{2})(\d{2})$/,"$1:$2"));
  return isNaN(d) ? 0 : d;
}
function ago(ts){
  if(!ts) return "";
  var m = Math.floor((Date.now()-ts)/60000);
  if(m < 1)  return "just now";
  if(m < 60) return m + "m ago";
  var h = Math.floor(m/60);
  if(h < 24) return h + "h ago";
  var d = Math.floor(h/24);
  return d === 1 ? "yesterday" : d + "d ago";
}
function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
  });
}
function withTimeout(p, ms){
  return Promise.race([p, new Promise(function(_,rej){ setTimeout(function(){ rej(new Error("timeout")); }, ms); })]);
}

/* ============================================================
   Feed parsing
   ============================================================ */
function parseXML(text, f){
  var doc = new DOMParser().parseFromString(text, "text/xml");
  if(doc.querySelector("parsererror")) throw new Error("bad xml");
  var nodes = doc.querySelectorAll("item");
  var atom = false;
  if(!nodes.length){ nodes = doc.querySelectorAll("entry"); atom = true; }
  if(!nodes.length) throw new Error("no items");

  var out = [];
  for(var i=0;i<nodes.length;i++){
    var n = nodes[i];
    var title = clean(n.querySelector("title") && n.querySelector("title").textContent);
    var link = "";
    if(atom){
      var ls = n.querySelectorAll("link");
      for(var j=0;j<ls.length;j++){
        var rel = ls[j].getAttribute("rel");
        if(!rel || rel === "alternate"){ link = ls[j].getAttribute("href") || ""; break; }
      }
      if(!link && ls[0]) link = ls[0].getAttribute("href") || "";
    } else {
      var le = n.querySelector("link");
      link = le ? clean(le.textContent) : "";
      if(!link){
        var gid = n.querySelector("guid");
        if(gid && /^https?:/i.test(gid.textContent)) link = clean(gid.textContent);
      }
    }
    var dEl = n.querySelector("pubDate") || n.querySelector("published") ||
              n.querySelector("updated")  || n.querySelector("date");
    var ts = parseDate(dEl && dEl.textContent);
    if(title && link) out.push({t:title, l:link, ts:ts, s:f.s, c:f.c});
  }
  return out;
}

function parseJSON2(text, f){
  var d = JSON.parse(text);
  if(d.status !== "ok" || !d.items || !d.items.length) throw new Error("rss2json empty");
  return d.items.map(function(it){
    return {t:clean(it.title), l:it.link, ts:parseDate(it.pubDate), s:f.s, c:f.c};
  }).filter(function(x){ return x.t && x.l; });
}

var deadProxy = {};   // per-load failure tally; a service that keeps failing gets benched

function fetchFeed(f, seed){
  // Start each feed on a different proxy so no single service takes every request,
  // and skip any service that has already failed repeatedly this run.
  var order = [], k, p;
  for(k=0;k<PROXIES.length;k++){
    p = PROXIES[(seed + k) % PROXIES.length];
    if((deadProxy[p.id]||0) < 3) order.push(p);
  }
  if(!order.length){ for(k=0;k<PROXIES.length;k++) order.push(PROXIES[(seed+k)%PROXIES.length]); }

  var attempt = function(i){
    if(i >= order.length) return Promise.reject(new Error("all proxies failed"));
    var px = order[i];
    return withTimeout(fetch(px.make(f.u), {cache:"no-store"}), 7000)
      .then(function(r){ if(!r.ok) throw new Error("http " + r.status); return r.text(); })
      .then(function(txt){
        if(px.mode === "json") return parseJSON2(txt, f);
        if(px.mode === "wrap"){
          var w = JSON.parse(txt);
          if(!w.contents) throw new Error("empty wrap");
          return parseXML(w.contents, f);
        }
        return parseXML(txt, f);
      })
      .then(function(items){ deadProxy[px.id] = 0; return items; })
      .catch(function(){
        deadProxy[px.id] = (deadProxy[px.id]||0) + 1;
        return new Promise(function(res){ setTimeout(res, 150); }).then(function(){ return attempt(i+1); });
      });
  };
  return attempt(0).then(function(items){
    if(f.okc) items = items.filter(function(x){ return OKC_RE.test(x.t); });
    items = items.filter(function(x){
      var u = (x.l || "").toLowerCase();
      for(var i=0;i<PAYWALL_DOMAINS.length;i++) if(u.indexOf(PAYWALL_DOMAINS[i]) >= 0) return false;
      return true;
    });
    return items.slice(0, f.cap || 8);
  });
}

/* ============================================================
   ESPN — Thunder news + schedule (CORS-open, no proxy needed)
   ============================================================ */
function espnNews(){
  return withTimeout(fetch("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/news?team=okc&limit=30",{cache:"no-store"}),12000)
    .then(function(r){ return r.json(); })
    .then(function(d){
      return (d.articles||[]).map(function(a){
        var link = "";
        if(a.links){
          if(a.links.web && a.links.web.href) link = a.links.web.href;
          else if(a.links.mobile && a.links.mobile.href) link = a.links.mobile.href;
        }
        return {t:clean(a.headline), l:link, ts:parseDate(a.published||a.lastModified), s:"ESPN", c:"thunder"};
      }).filter(function(x){ return x.t && x.l; }).slice(0,14);
    })
    .catch(function(){ return []; });
}

function espnSchedule(){
  return withTimeout(fetch("https://site.api.espn.com/apis/site/v2/sports/basketball/nba/teams/okc/schedule",{cache:"no-store"}),12000)
    .then(function(r){ return r.json(); })
    .then(function(d){
      var evs = (d.events||[]).map(function(e){
        var comp = (e.competitions && e.competitions[0]) || {};
        var st = (comp.status && comp.status.type) || {};
        var us=null, them=null;
        (comp.competitors||[]).forEach(function(c){
          var sc = c.score;
          if(sc && typeof sc === "object") sc = sc.displayValue !== undefined ? sc.displayValue : sc.value;
          var o = {
            name: (c.team && (c.team.shortDisplayName || c.team.displayName)) || "",
            abbr: (c.team && c.team.abbreviation) || "",
            score: (sc === undefined || sc === null || sc === "") ? null : parseInt(sc,10),
            home: c.homeAway === "home",
            winner: !!c.winner
          };
          if(o.abbr === "OKC") us = o; else them = o;
        });
        return {
          date: parseDate(e.date),
          state: st.state || "pre",
          done: !!st.completed,
          detail: st.shortDetail || st.detail || "",
          seasonType: (e.seasonType && e.seasonType.abbreviation) || "",
          us: us, them: them
        };
      }).filter(function(e){ return e.us && e.them; });

      var live = null, last = null, next = null, now = Date.now();
      evs.forEach(function(e){
        if(e.state === "in") live = e;
        else if(e.done){ if(!last || e.date > last.date) last = e; }
        else if(e.date >= now - 3*3600*1000){ if(!next || e.date < next.date) next = e; }
      });
      return {live:live, last:last, next:next, rec:(d.team && d.team.recordSummary) || ""};
    })
    .catch(function(){ return null; });
}

/* ============================================================
   Load — results paint as they arrive, not all at the end
   ============================================================ */
function pool(tasks, limit, onEach){
  var i = 0, done = 0, total = tasks.length;
  return new Promise(function(resolve){
    if(!total) return resolve();
    var runNext = function(){
      if(i >= total) return;
      var idx = i++;
      tasks[idx]()
        .then(function(r){ state.ok++; if(r && r.length) onEach(r); })
        .catch(function(){ state.fail++; })
        .then(function(){
          done++;
          setProg(done/total);
          if(done === total) resolve(); else runNext();
        });
    };
    for(var k=0;k<Math.min(limit,total);k++) runNext();
  });
}

function setProg(f){
  var el = $("prog").firstElementChild;
  el.style.width = Math.round(f*100) + "%";
  if(f >= 1) setTimeout(function(){ el.style.width = "0"; }, 500);
}

function mergeIn(list, incoming){
  viewCache = null;
  var seen = {};
  list.forEach(function(x){ seen[normKey(x.t)] = 1; });
  incoming.forEach(function(x){
    var k = normKey(x.t);
    if(!k || seen[k]) return;
    seen[k] = 1; list.push(x);
  });
  list.sort(function(a,b){ return b.ts - a.ts; });
  return list;
}

var paintTimer = null;
function paintSoon(){
  if(paintTimer) return;
  paintTimer = setTimeout(function(){ paintTimer = null; render(); }, 180);
}

// Prebuilt snapshot, refreshed server-side by GitHub Actions. Same-origin, so it
// needs no CORS proxy and always works even if every public proxy is down.
function loadSnapshot(fresh){
  return withTimeout(fetch("news.json?t=" + Date.now(), {cache:"no-store"}), 6000)
    .then(function(r){ if(!r.ok) throw new Error("no snapshot"); return r.json(); })
    .then(function(d){
      if(!d || !d.items || !d.items.length) throw new Error("empty snapshot");
      mergeIn(fresh, d.items);
      state.items = mergeIn(state.items.slice(), d.items);
      state.booting = false;
      if(d.games && !state.okGames){ state.okGames = d.games; renderScore(); }
      if(d.at) state.fetchedAt = Math.max(state.fetchedAt || 0, d.at);
      paintSoon();
      return true;
    })
    .catch(function(){ return false; });
}

function load(){
  if(state.loading) return;
  state.loading = true; state.ok = 0; state.fail = 0; deadProxy = {};
  $("btnR").classList.add("spin");
  setProg(0.03);

  var fresh = [];

  espnSchedule().then(function(sch){
    if(sch){ state.okGames = sch; renderScore(); }
  });

  var tasks = FEEDS.map(function(f, i){
    return function(){
      return new Promise(function(res){ setTimeout(res, (i % 4) * 100); })
        .then(function(){ return fetchFeed(f, i); });
    };
  });
  tasks.push(function(){ return espnNews(); });

  var live = pool(tasks, 5, function(items){
    mergeIn(fresh, items);
    state.items = mergeIn(state.items.slice(), items);
    state.booting = false;
    paintSoon();
  });

  Promise.all([loadSnapshot(fresh), live]).then(function(){
    // Swap in only what this run actually returned, so pulled/stale stories drop off.
    if(fresh.length >= 15) state.items = fresh;
    if(fresh.length) state.fetchedAt = Date.now();
    state.loading = false; state.booting = false;
    $("btnR").classList.remove("spin");
    if(fresh.length) save();
    render();
  });
}

function save(){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({
      at: state.fetchedAt,
      items: state.items.slice(0,400),
      games: state.okGames
    }));
  }catch(e){}
}
function restore(){
  try{
    var d = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
    if(d && d.items && d.items.length){
      state.items = d.items; state.fetchedAt = d.at || 0; state.okGames = d.games || null;
      return true;
    }
  }catch(e){}
  return false;
}

/* ============================================================
   Story clustering - one article per story, best source wins.
   Mirrors cluster_stories() in build_news.py; keep the two in sync.
   ============================================================ */
function tokenize(title){
  var out = {}, w = title.toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/);
  for(var i=0;i<w.length;i++){
    var x = w[i];
    if(x.length < 3 || STOPWORDS[x]) continue;
    if(x.length > 4 && x.charAt(x.length-1) === "s" && x.slice(-2) !== "ss") x = x.slice(0,-1);
    out[x] = 1;
  }
  return Object.keys(out);
}

function buildIdf(list){
  var n = list.length || 1, df = {};
  list.forEach(function(it){
    it._k = it._k || tokenize(it.t);
    it._k.forEach(function(w){ df[w] = (df[w]||0) + 1; });
  });
  var idf = {};
  for(var w in df) idf[w] = Math.log(n/(1+df[w])) + 0.2;
  return idf;
}

function simScore(a, b, idf){
  var setB = {}, i;
  for(i=0;i<b._k.length;i++) setB[b._k[i]] = 1;
  var shared = [];
  for(i=0;i<a._k.length;i++) if(setB[a._k[i]]) shared.push(a._k[i]);
  if(shared.length < 2) return 0;
  var num = 0, wa = 0, wb = 0;
  shared.forEach(function(w){ num += (idf[w]||0.2); });
  a._k.forEach(function(w){ wa += (idf[w]||0.2); });
  b._k.forEach(function(w){ wb += (idf[w]||0.2); });
  var d = Math.min(wa, wb);
  return d > 0 ? num/d : 0;
}

function rankOf(it){ var r = SOURCE_RANK[it.s]; return r === undefined ? 50 : r; }

// Collapses same-story coverage and returns one representative per story.
function clusterItems(list){
  if(list.length < 2) return list.slice();
  var idf = buildIdf(list);
  var sorted = list.slice().sort(function(a,b){ return b.ts - a.ts; });
  var clusters = [], byKey = {}, i;

  // Pass 1: seed from snapshot representatives. Their `mk` lists say exactly which
  // headlines the server already folded in, so live copies reattach instead of
  // forming a duplicate cluster for the same story.
  sorted.forEach(function(it){
    if(!it.mk || !it.mk.length) return;
    var c = {ts:it.ts, members:[it]};
    clusters.push(c);
    byKey[normKey(it.t)] = c;
    it.mk.forEach(function(k){ if(!byKey[k]) byKey[k] = c; });
  });

  // Pass 2: everything else, by exact key first, then similarity.
  sorted.forEach(function(it){
    if(it.mk && it.mk.length) return;
    var k = normKey(it.t);
    if(byKey[k]){ byKey[k].members.push(it); return; }
    var best = null, bestSim = 0;
    for(i=0;i<clusters.length;i++){
      var c = clusters[i];
      if(Math.abs(it.ts - c.ts) > CLUSTER_WINDOW) continue;
      var sm = 0;                       // single-link: compare against every member
      for(var j=0;j<c.members.length;j++){
        var v = simScore(it, c.members[j], idf);
        if(v > sm) sm = v;
      }
      if(sm > bestSim){ bestSim = sm; best = c; }
    }
    if(best && bestSim >= SIM_THRESHOLD) best.members.push(it);
    else { best = {ts:it.ts, members:[it]}; clusters.push(best); }
    byKey[k] = best;
  });

  return clusters.map(function(c){
    var members = c.members.slice().sort(function(a,b){
      return (rankOf(a) - rankOf(b)) || (b.ts - a.ts);
    });
    var rep = members[0], seen = {}, also = [];
    members.forEach(function(m){
      if(m.s !== rep.s && !seen[m.s]){ seen[m.s] = 1; also.push(m.s); }
      (m.also || []).forEach(function(x){
        if(x !== rep.s && !seen[x]){ seen[x] = 1; also.push(x); }
      });
    });
    if(!also.length) return rep;
    var out = {};
    for(var kk in rep) if(kk !== "_k") out[kk] = rep[kk];
    out.n = also.length; out.also = also.slice(0,4);
    return out;
  }).sort(function(a,b){ return b.ts - a.ts; });
}

/* ============================================================
   Search - filters every loaded headline across all four sections
   ============================================================ */
function parseQuery(q){
  // Supports "quoted phrases" plus bare words; every term must match (AND).
  var terms = [], rx = /"([^"]+)"|(\S+)/g, m;
  while((m = rx.exec(q)) !== null){
    var t = (m[1] || m[2] || "").toLowerCase().trim();
    if(t) terms.push(t);
  }
  return terms;
}

function rxEscape(t){ return t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }

function matchesAll(item, terms){
  var hay = (item.t + " " + item.s + " " + ((item.also || []).join(" "))).toLowerCase();
  for(var i=0;i<terms.length;i++) if(hay.indexOf(terms[i]) < 0) return false;
  return true;
}

// Highlights matches without ever trusting raw text as HTML: each slice is escaped
// separately, so a headline containing < or & can't inject markup.
function highlight(text, terms){
  if(!terms.length) return esc(text);
  var rx = new RegExp("(" + terms.map(rxEscape).join("|") + ")", "ig");
  var out = "", last = 0, m;
  while((m = rx.exec(text)) !== null){
    if(m[0].length === 0){ rx.lastIndex++; continue; }
    out += esc(text.slice(last, m.index)) + "<mark>" + esc(m[0]) + "</mark>";
    last = m.index + m[0].length;
  }
  return out + esc(text.slice(last));
}

function searchResults(terms){
  var v = views(), hits = [];
  ["top","thunder","faith","tech"].forEach(function(k){
    (v[k] || []).forEach(function(it){ if(matchesAll(it, terms)) hits.push(it); });
  });
  hits.sort(function(a,b){ return b.ts - a.ts; });
  return hits;
}

function catLabel(k){
  for(var i=0;i<CATS.length;i++) if(CATS[i].k === k) return CATS[i].label;
  return k;
}

/* ============================================================
   Render
   ============================================================ */
// Clustered view per category, rebuilt only when the underlying items change.
var viewCache = null, viewStamp = -1;
function views(){
  if(viewCache && viewStamp === state.items.length + state.fetchedAt) return viewCache;
  var v = {};
  ["top","thunder","faith","tech"].forEach(function(k){
    v[k] = clusterItems(state.items.filter(function(x){ return x.c === k; }));
  });
  viewCache = v; viewStamp = state.items.length + state.fetchedAt;
  return v;
}

function counts(){
  var v = views();
  return {top:v.top.length, thunder:v.thunder.length, faith:v.faith.length, tech:v.tech.length};
}

function renderTabs(){
  var n = counts();
  $("tabs").innerHTML = CATS.map(function(c){
    return '<button class="tab' + (state.cat===c.k ? ' on':'') + '" data-k="' + c.k + '">' +
             '<span class="dot"></span>' + c.label +
             (n[c.k] ? ' <span class="n">' + n[c.k] + '</span>' : '') +
           '</button>';
  }).join("");
}

function seasonLabel(a){
  var t = String(a||"").toUpperCase();
  if(t === "PRE") return "Preseason";
  if(t === "POST" || t === "PST") return "Playoffs";
  return "";
}

function fmtGameLine(g, kind){
  var us = g.us, them = g.them;
  var vs = us.home ? "vs" : "@";
  var won = us.score !== null && them.score !== null && us.score > them.score;
  var lost = us.score !== null && them.score !== null && us.score < them.score;
  var scoreTxt = (us.score !== null && them.score !== null)
      ? '<span class="sc ' + (won ? 'win' : lost ? 'loss' : '') + '">' +
        us.score + '&ndash;' + them.score + '</span>'
      : '';
  var tag = kind === "live" ? '<span class="pill live">Live</span>'
          : kind === "last" ? '<span class="pill">' + (won ? 'W' : lost ? 'L' : 'Final') + '</span>'
          : '<span class="pill">Next</span>';
  return '<div class="row">' + tag +
         '<span class="tm">' + vs + ' ' + esc(them.name) + '</span>' + scoreTxt + '</div>';
}

function renderScore(){
  var w = $("scoreWrap");
  if(state.cat !== "thunder" || !state.okGames){ w.innerHTML = ""; return; }
  var g = state.okGames, rows = "", meta = [];

  if(g.live){
    rows += fmtGameLine(g.live, "live");
    meta.push(g.live.detail);
  }
  if(g.last && !g.live){
    rows += fmtGameLine(g.last, "last");
    meta.push(new Date(g.last.date).toLocaleDateString([], {month:"short", day:"numeric"}));
  }
  if(g.next){
    rows += fmtGameLine(g.next, "next");
    var dt = new Date(g.next.date);
    meta.push(dt.toLocaleDateString([], {weekday:"short", month:"short", day:"numeric"}) +
              " &middot; " + dt.toLocaleTimeString([], {hour:"numeric", minute:"2-digit"}) +
              (seasonLabel(g.next.seasonType) ? " &middot; " + seasonLabel(g.next.seasonType) : ""));
  }
  if(!rows){ w.innerHTML = ""; return; }

  w.innerHTML = '<div class="score">' +
    '<div class="lbl">Oklahoma City Thunder' + (g.rec ? ' &middot; ' + esc(g.rec) : '') + '</div>' +
    rows +
    (meta.length ? '<div class="meta">' + meta.join(" &nbsp;|&nbsp; ") + '</div>' : '') +
  '</div>';
}

function render(){
  var terms = parseQuery(state.q || "");
  var searching = terms.length > 0;
  var feed = $("feed");

  // Search takes over the tab row; the score strip is section-specific so it hides.
  $("tabs").hidden = searching;
  $("resultBar").hidden = !searching;
  $("qClear").hidden = !(state.q || "").length;

  var list;
  if(searching){
    list = searchResults(terms);
    $("scoreWrap").innerHTML = "";
    $("resultBar").innerHTML =
      '<span><b>' + list.length + '</b> ' + (list.length === 1 ? "result" : "results") +
      ' for &ldquo;' + esc(state.q.trim()) + '&rdquo;</span>' +
      '<button type="button" id="qDone">Clear</button>';
  } else {
    renderTabs();
    renderScore();
    list = views()[state.cat] || [];
  }

  // stamp
  if(state.fetchedAt){
    $("stampT").textContent = "Updated " + ago(state.fetchedAt);
    $("stampN").textContent = (searching ? state.items.length : counts()[state.cat]) + " stories";
  }

  if(!list.length){
    if(searching){
      feed.innerHTML = '<div class="empty"><b>No headlines match that</b>' +
        'Wire searches the ' + state.items.length + ' headlines currently loaded, not the ' +
        'full text of articles. Try a shorter or more common word.</div>';
      return;
    }
    if(state.loading || state.booting){
      feed.innerHTML = new Array(7).join("x").split("x").map(function(){
        return '<div class="sk"><i></i><i></i><i></i></div>';
      }).join("");
    } else {
      feed.innerHTML = '<div class="empty"><b>Nothing loaded yet</b>' +
        (state.fail ? "Couldn't reach the sources. Check your connection and tap ↻ to try again."
                    : "Tap ↻ to pull the latest headlines.") + '</div>';
    }
    return;
  }

  // group by age
  var now = Date.now(), groups = [
    {name:"Last 3 hours", max:3*3600e3,  items:[]},
    {name:"Today",        max:24*3600e3, items:[]},
    {name:"Earlier",      max:Infinity,  items:[]}
  ];
  list.forEach(function(x){
    var age = x.ts ? now - x.ts : Infinity;
    for(var i=0;i<groups.length;i++){
      if(age <= groups[i].max){ groups[i].items.push(x); return; }
    }
    groups[2].items.push(x);
  });

  var html = "";
  groups.forEach(function(g){
    if(!g.items.length) return;
    html += '<div class="grp">' + g.name + '</div>';
    g.items.forEach(function(x){
      var isRead = readSet.has(normKey(x.t));
      var age = x.ts ? now - x.ts : Infinity;
      var timeTxt = x.ts ? ago(x.ts) : "";
      html += '<a class="item' + (isRead ? ' read':'') + '" href="' + esc(x.l) +
              '" target="_blank" rel="noopener" data-k="' + esc(normKey(x.t)) + '">' +
                '<div class="h">' + (searching ? highlight(x.t, terms) : esc(x.t)) + '</div>' +
                '<div class="m">' +
                  (searching ? '<span class="cat k-' + x.c + '">' + esc(catLabel(x.c)) +
                     '</span>' : '') +
                  '<span class="src c-' + x.c + '">' +
                    (searching ? highlight(x.s, terms) : esc(x.s)) + '</span>' +
                  (timeTxt ? '<span class="sep">&middot;</span><span' +
                     (age < 3600e3 ? ' class="fresh"' : '') + '>' + timeTxt + '</span>' : '') +
                  (x.n ? '<span class="also" title="' + esc((x.also||[]).join(", ")) + '">+' +
                     x.n + ' outlet' + (x.n > 1 ? 's' : '') + '</span>' : '') +
                '</div>' +
              '</a>';
    });
  });
  feed.innerHTML = html;
}

/* ============================================================
   Interactions
   ============================================================ */
function setQuery(v, opts){
  state.q = v;
  if(!opts || !opts.fromInput) $("q").value = v;
  render();
  if(!opts || !opts.keepScroll) window.scrollTo({top:0});
}

$("q").addEventListener("input", function(e){
  setQuery(e.target.value, {fromInput:true, keepScroll:false});
});

// Enter closes the keyboard rather than submitting anywhere.
$("searchForm").addEventListener("submit", function(e){
  e.preventDefault();
  $("q").blur();
});

$("qClear").addEventListener("click", function(){
  setQuery("");
  $("q").focus();
});

$("resultBar").addEventListener("click", function(e){
  if(e.target.id === "qDone"){ setQuery(""); $("q").blur(); }
});

$("q").addEventListener("keydown", function(e){
  if(e.key === "Escape"){ setQuery(""); $("q").blur(); }
});

$("tabs").addEventListener("click", function(e){
  var t = e.target.closest(".tab");
  if(!t) return;
  state.cat = t.dataset.k;
  if(state.q){ state.q = ""; $("q").value = ""; }
  try{ localStorage.setItem("wire.tab", state.cat); }catch(err){}
  render();
  window.scrollTo({top:0, behavior:"smooth"});
});

$("feed").addEventListener("click", function(e){
  var a = e.target.closest(".item");
  if(!a) return;
  readSet.add(a.dataset.k);
  a.classList.add("read");
  try{ localStorage.setItem(READ_KEY, JSON.stringify(Array.from(readSet).slice(-600))); }catch(err){}
});

$("btnR").addEventListener("click", function(){ load(); });

// pull-to-refresh
var startY = 0, pulling = false;
document.addEventListener("touchstart", function(e){
  if(window.scrollY <= 0){ startY = e.touches[0].clientY; pulling = true; }
}, {passive:true});
document.addEventListener("touchmove", function(e){
  if(!pulling) return;
  if(e.touches[0].clientY - startY > 85 && window.scrollY <= 0){
    pulling = false;
    load();
  }
}, {passive:true});
document.addEventListener("touchend", function(){ pulling = false; }, {passive:true});

// refresh when reopened after being away, if stale
document.addEventListener("visibilitychange", function(){
  if(!document.hidden && Date.now() - state.fetchedAt > STALE_MS) load();
});

// keep the "updated Xm ago" stamp honest
setInterval(function(){
  if(state.fetchedAt) $("stampT").textContent = "Updated " + ago(state.fetchedAt);
}, 60000);

/* ============================================================
   Init — show cache instantly, then refresh in the background
   ============================================================ */
try{
  var savedTab = localStorage.getItem("wire.tab");
  if(savedTab && CATS.some(function(c){ return c.k === savedTab; })) state.cat = savedTab;
}catch(e){}

var hadCache = restore();
state.booting = !hadCache;   // show skeletons on a cold start
render();
load();
</script>
</body>
</html>
