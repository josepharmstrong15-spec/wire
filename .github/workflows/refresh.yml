name: Refresh headlines

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay under load)
  workflow_dispatch:          # lets you refresh on demand from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build news.json
        run: python build_news.py

      - name: Commit if changed
        run: |
          git config user.name  "wire-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "headlines: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
